name: Build Debian package

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debian-package.yml'
  workflow_run:
    # Chained after the phar build (test -> phar -> deb) rather than
    # listening to "Build and Test" directly, so it also gets a free ride on
    # that job's already-built production vendor/ (see below) instead of
    # running "composer install --no-dev" a second time.
    workflows: ["Build moosh2.phar"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-deb:
    runs-on: ubuntu-latest
    # Build on EVERY branch (stable "2.x" and feature branches alike) as long
    # as the triggering "Build moosh2.phar" run succeeded (which itself only
    # ran because "Build and Test" passed). There's no result to check for a
    # direct push/workflow_dispatch trigger, so those always proceed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # IMPORTANT: for a workflow_run trigger, checkout with no "ref"
          # checks out the repo's DEFAULT branch, not the branch that
          # actually triggered "Build and Test". Without this, every
          # feature-branch build would silently package the default
          # branch's code instead of the feature branch's code.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Determine branch and package naming
        id: branch_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          if [ "$BRANCH" = "2.x" ]; then
            IS_STABLE=true
            SAFE_BRANCH=""
            # Keep the artifact name stable ones have always used, so the
            # publish workflow's "find the latest debian-package artifact"
            # fallback only ever matches stable builds.
            ARTIFACT_NAME="debian-package"
          else
            # Debian upstream-version chars are limited to [A-Za-z0-9.+~],
            # so turn anything else (e.g. the "/" in "feature/foo") into ".".
            SAFE_BRANCH=$(echo "$BRANCH" | tr -c 'A-Za-z0-9' '.' | sed -E 's/\.+/./g; s/^\.|\.$//g')
            IS_STABLE=false
            # Give feature-branch artifacts a distinct name so they can
            # never be picked up by anything expecting the stable package.
            ARTIFACT_NAME="debian-package-unstable-${SAFE_BRANCH}"
          fi

          {
            echo "branch=$BRANCH"
            echo "is_stable=$IS_STABLE"
            echo "safe_branch=$SAFE_BRANCH"
            echo "artifact_name=$ARTIFACT_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: phar.readonly=0

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper build-essential

      - name: Download production vendor/ from Build moosh2.phar
        # The phar (built by debian/rules via bin/build-phar.php) bundles
        # vendor/ into itself, so it must already be installed before
        # dpkg-buildpackage runs - unlike moosh 1.x, which didn't need this.
        # build-phar.yml just ran "composer install --no-dev
        # --optimize-autoloader" for this exact commit, so reuse its output
        # instead of installing a second time.
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: moosh2-vendor-nodev
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Unpack downloaded vendor/
        if: github.event_name == 'workflow_run'
        run: unzip -q vendor-nodev.zip

      - name: Install composer dependencies directly
        # Fallback for a manual workflow_dispatch or a push to this workflow
        # file itself, where there's no upstream "Build moosh.phar" run to
        # download vendor/ from.
        if: github.event_name != 'workflow_run'
        run: composer install --no-dev --optimize-autoloader

      - name: Build Debian package
        env:
          BRANCH: ${{ steps.branch_info.outputs.branch }}
          IS_STABLE: ${{ steps.branch_info.outputs.is_stable }}
          SAFE_BRANCH: ${{ steps.branch_info.outputs.safe_branch }}
        run: |
          # Prepare an isolated build directory (vendor/ included, unlike
          # a plain git checkout, since it's not tracked in the repo).
          mkdir -p .build
          tmpdir="$(mktemp -d -p "$PWD/.build" moosh2-deb-XXXXXX)"
          mkdir -p "$tmpdir/src"
          find . -mindepth 1 -maxdepth 1 \( ! -name '.build' ! -name '.git' ! -name '.github' \) -exec cp -a {} "$tmpdir/src/" \;
          cd "$tmpdir/src"

          # Extract base version the same way bin/build-deb-source.sh does.
          BASE_VERSION=$(grep -oP "const VERSION = '\K[^']+" src/Application.php)
          if [ -z "$BASE_VERSION" ]; then
            echo "Error: could not detect version from src/Application.php" >&2
            exit 1
          fi

          # Build dynamic version string for this snapshot build. This
          # intentionally discards the committed debian/changelog (which is
          # for formal Launchpad releases via bin/build-deb-source.sh) in
          # favour of a fresh, ephemeral entry tied to this commit - this
          # workflow produces dev/snapshot builds, not tagged releases.
          TIMESTAMP=$(date -u +'%Y%m%d%H%M%S')
          SHORT_SHA="${GITHUB_SHA:0:7}"

          if [ "$IS_STABLE" = "true" ]; then
            PKG_VERSION="${BASE_VERSION}+git${TIMESTAMP}.${SHORT_SHA}-1"
          else
            # "~" sorts BEFORE nothing in Debian's version comparison rules,
            # so an unstable/feature-branch build always sorts lower than a
            # stable release carrying the same base version - apt will never
            # offer one of these as an "upgrade" on a system tracking the
            # stable repo.
            PKG_VERSION="${BASE_VERSION}+git${TIMESTAMP}.${SHORT_SHA}~unstable-feature.${SAFE_BRANCH}-1"
          fi
          echo "Building package version: $PKG_VERSION (branch: $BRANCH)"

          rm -f debian/changelog
          export DEBFULLNAME="GitHub Actions"
          export DEBEMAIL="actions@github.com"
          dch --create --package moosh2 -v "$PKG_VERSION" --distribution unstable "Automated build for commit ${SHORT_SHA} (branch: ${BRANCH})"

          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b -d
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$tmpdir"/moosh2_*.deb "$GITHUB_WORKSPACE/dist/"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.branch_info.outputs.artifact_name }}
          path: |
            dist/*.deb
