# documentation.

name: Psalm

on:
  push:
    branches: [ "2.x" ]

jobs:
  psalm:
    name: Psalm
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Psalm Security Scan
        uses: docker://ghcr.io/psalm/psalm-security-scan
        with:
          working_dir: plugin

      - name: Upload Psalm SARIF results
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: plugin/results.sarif
          category: psalm
