name: Update pluglist.php mirror

on:
  schedule:
    # Adjust to taste — hourly here
    - cron: '0 * * * *'
  workflow_dispatch: {}
  # Lets you (or any host with a PAT) trigger this remotely:
  #   curl -X POST \
  #     -H "Authorization: token $GH_PAT" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/OWNER/REPO/dispatches \
  #     -d '{"event_type":"update-pluglist"}'
  repository_dispatch:
    types: [update-pluglist]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install curl-impersonate
        run: |
          curl -sSL -o curl-impersonate.tar.gz \
            https://github.com/lwthiker/curl-impersonate/releases/latest/download/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf curl-impersonate.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch pluglist.php
        run: |
          mkdir -p data
          curl_chrome124 -sSf \
            "https://download.moodle.org/api/1.3/pluglist.php" \
            -o data/pluglist.xml

      - name: Validate fetch didn't return an empty/error page
        run: |
          if [ ! -s data/pluglist.xml ]; then
            echo "::error::Downloaded file is empty"
            exit 1
          fi
          head -c 200 data/pluglist.xml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pluglist.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update pluglist mirror ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

      - name: Purge jsDelivr cache (best-effort)
        if: success()
        run: |
          curl -sSf "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/pluglist.xml" || true
