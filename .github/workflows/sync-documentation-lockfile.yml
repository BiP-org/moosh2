name: Sync documentation lock file

on:
  push:
    paths:
      - 'documentation/package.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-lockfile:
    # Skip runs triggered by this workflow's own PR-fix commits to avoid loops
    if: "!contains(github.event.head_commit.message, '[skip lockfile-sync]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documentation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Regenerate lock file
        run: npm install --package-lock-only

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): sync package-lock.json with package.json [skip lockfile-sync]"
          branch: chore/sync-lockfile-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          title: "chore(deps): sync documentation/package-lock.json"
          body: |
            `documentation/package.json` was changed in ${{ github.sha }} but
            `documentation/package-lock.json` was left out of sync, which breaks
            `npm ci` in downstream workflows (e.g. the GitHub Pages publish job).

            This PR regenerates the lock file with `npm install --package-lock-only`
            against the current `package.json` on `${{ github.ref_name }}`.

            Auto-generated by the "Sync documentation lock file" workflow.
          labels: |
            dependencies
