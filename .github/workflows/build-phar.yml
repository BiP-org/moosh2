name: Build moosh.phar

on:
  push:
    branches: [ "2.x" ]
  workflow_run:
    workflows: ["Build and Test"]
    types:
      - completed

jobs:
  build-phar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: phar.readonly=0

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build moosh.phar
        run: php -d phar.readonly=0 bin/build-phar.php

      - name: Verify phar works
        run: php bin/moosh.phar list

      - name: Upload moosh.phar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: moosh-phar
          path: moosh.phar

      - name: Create or update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phar-latest
          name: moosh.phar (latest build)
          body: |
            Latest `moosh.phar` built from the `2.x` branch.

            Commit: ${{ github.sha }}
          files: moosh.phar
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
